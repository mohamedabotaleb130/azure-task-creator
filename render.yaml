services:
  - type: web
    name: azure-task-creator
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python web_app.py
    disk:
      name: azure-task-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: AZURE_TASK_DATA_DIR
        value: /var/data
      - key: AZURE_PAT
        sync: false
      - key: AZURE_USER
        value: Mohamed Hatem Abo Taleb <mhatem@diginationmea.com>
      - key: AZURE_ORG
        value: Digination
      - key: AZURE_PROJECT
        value: HRDF-2026
      - key: AZURE_MANAGER
        value: Khaled Abd El-Rahman Abd El Fattah
